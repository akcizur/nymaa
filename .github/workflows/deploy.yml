name: Godot Web — Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  PROJECT_PATH: .
  EXPORT_NAME: nymaa

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/\${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/\${GODOT_VERSION}.stable

      - name: Validate GDScript
        shell: bash
        run: |
          set -e
          for script in scripts/*.gd; do
            echo "Checking \$script"
            godot --headless --path "\${PROJECT_PATH}" --check-only --script "res://\${script#./}"
          done

      - name: Validate project
        run: |
          godot --headless --editor --quit --path "\${PROJECT_PATH}"

      - name: Export Web
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="\$(readlink -f build)"
          cd "\${PROJECT_PATH}"
          godot --headless --verbose --export-release "Web" "\${EXPORT_DIR}/web/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
