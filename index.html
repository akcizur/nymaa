<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Nymaa — Top-Down Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0e1116;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; width:100%; height:100%; }

  #hud {
    position:fixed;
    z-index:10;
    left:12px;
    top:calc(12px + env(safe-area-inset-top));
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#c9d3dd;
    background:rgba(14,17,22,.74);
    border:1px solid rgba(255,255,255,.10);
    padding:8px 12px;
    border-radius:8px;
    pointer-events:none;
    letter-spacing:.03em;
    backdrop-filter:blur(8px);
  }
  #hud b { color:#7fd1ff; }
  #mode { color:#ffd479; font-weight:700; }

  #touch {
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
  }
  .joystick,.action {
    pointer-events:auto;
    position:absolute;
    touch-action:none;
  }
  .joystick {
    left:calc(20px + env(safe-area-inset-left));
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:132px;
    height:132px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(14,17,22,.38);
    box-shadow:inset 0 0 0 14px rgba(255,255,255,.025);
    backdrop-filter:blur(6px);
  }
  .knob {
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    margin:-29px 0 0 -29px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.12);
    transform:translate(0,0);
    pointer-events:none;
  }
  .action {
    right:calc(24px + env(safe-area-inset-right));
    bottom:calc(28px + env(safe-area-inset-bottom));
    width:78px;
    height:78px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.20);
    background:rgba(14,17,22,.48);
    color:#fff;
    font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.06em;
    display:none;
    backdrop-filter:blur(7px);
  }
  .action.show { display:block; }
  .hint {
    position:absolute;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom));
    font:8px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:rgba(255,255,255,.38);
    letter-spacing:.10em;
  }

  @media (pointer:fine) {
    #touch { display:none; }
  }

  @media (max-height:520px) and (pointer:coarse) {
    .joystick { width:108px; height:108px; }
    .knob { width:50px; height:50px; margin:-25px 0 0 -25px; }
    .action { width:64px; height:64px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div><b>WASD</b> / <b>šipky</b> — pohyb</div>
  <div><b>E</b> — auto</div>
  <div id="mode">ON FOOT</div>
</div>

<div id="touch" aria-hidden="true">
  <div id="joystick" class="joystick"><div id="knob" class="knob"></div></div>
  <button id="action" class="action" type="button">ENTER</button>
  <div class="hint">DRAG TO MOVE / DRIVE</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════ DEVICE / RENDERER ═══════════ */
const touchDevice =
  matchMedia('(pointer: coarse)').matches ||
  'ontouchstart' in window ||
  navigator.maxTouchPoints > 0;

const W = 100;
const H = W / 2;

const renderer = new THREE.WebGLRenderer({
  antialias: !touchDevice,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, touchDevice ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = !touchDevice;
if (!touchDevice) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 70, 140);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

/* ═══════════ LIGHT ═══════════ */
scene.add(new THREE.HemisphereLight(0xc8d8e8, 0x20252c, touchDevice ? 1.35 : 1.6));

if (!touchDevice) {
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
  sun.position.set(38, 62, 26);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -60;
  sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60;
  sun.shadow.camera.bottom = -60;
  scene.add(sun);
} else {
  const fill = new THREE.DirectionalLight(0xe6edf5, 0.75);
  fill.position.set(28, 44, 16);
  scene.add(fill);
}

/* ═══════════ GROUND ═══════════ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(W, W),
  new THREE.MeshLambertMaterial({ color: 0x38473f })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = !touchDevice;
scene.add(ground);

/* ═══════════ ROADS ═══════════ */
const roadMat = new THREE.MeshLambertMaterial({ color: 0x1c2026 });
function road(w, d, x, z, y = 0.02) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = !touchDevice;
  scene.add(m);
}
road(W, 10, 0, -20);
road(W, 10, 0, 20);
road(10, W, -25, 0, 0.024);
road(10, W, 25, 0, 0.024);

/* ═══════════ BUILDINGS / COLLISION ═══════════ */
const colliders = [];
const TYPES = {
  HOUSE:     { w:10, h:4,  d:10, c:0xb87b52 },
  OFFICE:    { w:12, h:12, d:12, c:0x76839a },
  SHOP:      { w:14, h:5,  d:10, c:0xc9a24a },
  WAREHOUSE: { w:20, h:6,  d:14, c:0x8a97a5 },
  BLOCK:     { w:16, h:20, d:16, c:0x5f6a7a }
};

const LAYOUT = [
  ['OFFICE',-10,-6], ['SHOP',8,-8], ['HOUSE',-12,8], ['OFFICE',10,8],
  ['HOUSE',-38,-35], ['WAREHOUSE',0,-35], ['SHOP',37,-35],
  ['OFFICE',-38,35], ['BLOCK',-8,35], ['SHOP',10,35], ['HOUSE',37,35],
  ['HOUSE',-37,0], ['OFFICE',37,0]
];

for (const [k, x, z] of LAYOUT) {
  const t = TYPES[k];
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(t.w, t.h, t.d),
    new THREE.MeshLambertMaterial({ color: t.c })
  );
  m.position.set(x, t.h / 2, z);
  m.castShadow = m.receiveShadow = !touchDevice;
  scene.add(m);
  colliders.push({
    minX:x-t.w/2,
    maxX:x+t.w/2,
    minZ:z-t.d/2,
    maxZ:z+t.d/2
  });
}

/* ═══════════ HELPERS ═══════════ */
function mesh(g, col, y, x = 0, z = 0) {
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: col }));
  m.position.set(x, y, z);
  m.castShadow = !touchDevice;
  return m;
}

function pushOut(pos, r) {
  for (const c of colliders) {
    const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
    const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
    const dx = pos.x - cx;
    const dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;

    if (d2 >= r * r) continue;

    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const p = r - d;
      pos.x += dx / d * p;
      pos.z += dz / d * p;
    } else {
      const dl = pos.x - c.minX;
      const dr = c.maxX - pos.x;
      const db = pos.z - c.minZ;
      const df = c.maxZ - pos.z;
      const m = Math.min(dl, dr, db, df);

      if      (m === dl) pos.x = c.minX - r;
      else if (m === dr) pos.x = c.maxX + r;
      else if (m === db) pos.z = c.minZ - r;
      else               pos.z = c.maxZ + r;
    }
  }
}

const carProbe = new THREE.Vector3();

function pushCar(obj) {
  const R = 1.15;

  for (const off of [1.35, -1.35]) {
    carProbe.set(
      obj.position.x + Math.sin(obj.rotation.y) * off,
      0,
      obj.position.z + Math.cos(obj.rotation.y) * off
    );

    const bx = carProbe.x;
    const bz = carProbe.z;

    pushOut(carProbe, R);

    obj.position.x += carProbe.x - bx;
    obj.position.z += carProbe.z - bz;
  }
}

function clampW(p, m) {
  const l = H - m;
  p.x = Math.max(-l, Math.min(l, p.x));
  p.z = Math.max(-l, Math.min(l, p.z));
}

/* ═══════════ PLAYER ═══════════ */
const player = new THREE.Group();
player.add(mesh(new THREE.CapsuleGeometry(.36,.72,6,12), 0x4fa3e3, .72));
player.add(mesh(new THREE.SphereGeometry(.30,16,12), 0xf0c9a0, 1.52));
player.add(mesh(new THREE.BoxGeometry(.18,.18,.26), 0x14324a, 1.52, 0, .30));
player.position.set(0, 0, -20);
scene.add(player);

/* ═══════════ CAR ═══════════ */
const car = new THREE.Group();
car.add(mesh(new THREE.BoxGeometry(2,.7,4.4), 0xd94f4f, .75));
car.add(mesh(new THREE.BoxGeometry(1.7,.62,2), 0x2b3440, 1.40, 0, -.25));

{
  const wg = new THREE.CylinderGeometry(.42,.42,.32,14);
  wg.rotateZ(Math.PI / 2);

  const wm = new THREE.MeshLambertMaterial({ color: 0x15181d });

  for (const [x,z] of [[-1.02,1.45],[1.02,1.45],[-1.02,-1.45],[1.02,-1.45]]) {
    const w = new THREE.Mesh(wg, wm);
    w.position.set(x, .42, z);
    w.castShadow = !touchDevice;
    car.add(w);
  }
}

car.position.set(6, 0, -20);
scene.add(car);

const carState = {
  speed:0,
  max:24,
  maxRev:9,
  accel:16,
  brake:32,
  drag:2.4
};

/* ═══════════ INPUT ═══════════ */
const keys = new Set();
const mobileInput = { x:0, y:0, active:false };
let enter = false;

addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'KeyE' && !keys.has('KeyE')) enter = true;
  keys.add(e.code);
});

addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

/* ═══════════ TOUCH ═══════════ */
const touchUI = document.getElementById('touch');
const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
const action = document.getElementById('action');

function setStick(clientX, clientY) {
  const r = joystick.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const radius = r.width * 0.36;

  let x = (clientX - cx) / radius;
  let y = (clientY - cy) / radius;

  const len = Math.hypot(x, y);
  if (len > 1) {
    x /= len;
    y /= len;
  }

  mobileInput.x = x;
  mobileInput.y = y;
  knob.style.transform = `translate(${x * radius}px,${y * radius}px)`;
}

function resetStick() {
  mobileInput.x = 0;
  mobileInput.y = 0;
  mobileInput.active = false;
  knob.style.transform = 'translate(0,0)';
}

if (touchDevice) {
  joystick.addEventListener('pointerdown', e => {
    e.preventDefault();
    mobileInput.active = true;
    joystick.setPointerCapture(e.pointerId);
    setStick(e.clientX, e.clientY);
  });

  joystick.addEventListener('pointermove', e => {
    if (mobileInput.active) setStick(e.clientX, e.clientY);
  });

  joystick.addEventListener('pointerup', resetStick);
  joystick.addEventListener('pointercancel', resetStick);
  joystick.addEventListener('lostpointercapture', resetStick);

  action.addEventListener('pointerdown', e => {
    e.preventDefault();
    enter = true;
  });
}

/* ═══════════ UPDATE ═══════════ */
let driving = false;
const SPEED = 7;
const RAD = .55;
const RANGE = 4.2;

function updatePlayer(dt) {
  let ix = 0;
  let iz = 0;

  if (keys.has('KeyW') || keys.has('ArrowUp')) iz -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iz += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;

  if (mobileInput.active) {
    ix = mobileInput.x;
    iz = mobileInput.y;
  }

  const len = Math.hypot(ix, iz);

  if (len > 0.04) {
    ix /= len;
    iz /= len;

    player.position.x += ix * SPEED * dt;
    player.position.z += iz * SPEED * dt;

    const t = Math.atan2(ix, iz);
    let d = (t - player.rotation.y) % (Math.PI * 2);

    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;

    player.rotation.y += d * (1 - Math.exp(-14 * dt));
  }

  player.position.y = 0;
  pushOut(player.position, RAD);
  clampW(player.position, RAD + .1);
}

function updateCar(dt) {
  let th = 0;
  let st = 0;

  if (keys.has('KeyW') || keys.has('ArrowUp')) th += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) th -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) st += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) st -= 1;

  if (mobileInput.active) {
    th = -mobileInput.y;
    st = mobileInput.x;
  }

  if (th > 0.04) {
    carState.speed += carState.accel * th * dt;
  } else if (th < -0.04) {
    if (carState.speed > 0.2) {
      carState.speed -= carState.brake * Math.abs(th) * dt;
    } else {
      carState.speed -= carState.accel * Math.abs(th) * .6 * dt;
    }
  } else {
    carState.speed -= carState.speed * carState.drag * dt;
    if (Math.abs(carState.speed) < .05) carState.speed = 0;
  }

  carState.speed = Math.max(-carState.maxRev, Math.min(carState.max, carState.speed));

  if (Math.abs(st) > 0.04 && Math.abs(carState.speed) > .3) {
    const grip = Math.min(1, Math.abs(carState.speed) / 6);
    car.rotation.y += st * 2.2 * dt * grip * Math.sign(carState.speed);
  }

  car.position.x += Math.sin(car.rotation.y) * carState.speed * dt;
  car.position.z += Math.cos(car.rotation.y) * carState.speed * dt;

  const bx = car.position.x;
  const bz = car.position.z;

  pushCar(car);

  if (Math.hypot(car.position.x - bx, car.position.z - bz) > .001) {
    carState.speed *= .3;
  }

  clampW(car.position, 2.6);
}

/* ═══════════ CAMERA ═══════════ */
const focus = new THREE.Vector3(0,0,-20);

function updateCamera(dt, first = false) {
  const dist = driving ? 16 : 13;
  const height = driving ? 23 : 19;
  const ahead = driving ? 4.5 : 0;
  const sub = driving ? car : player;

  const tx = sub.position.x + (driving ? Math.sin(car.rotation.y) * ahead : 0);
  const tz = sub.position.z + (driving ? Math.cos(car.rotation.y) * ahead : 0);

  const k = first ? 1 : 1 - Math.exp(-7 * dt);
  focus.x += (tx - focus.x) * k;
  focus.z += (tz - focus.z) * k;

  const des = new THREE.Vector3(focus.x, height, focus.z + dist);
  camera.position.lerp(des, first ? 1 : 1 - Math.exp(-6 * dt));

  if (camera.position.y < 6) camera.position.y = 6;
  camera.lookAt(focus.x, 1, focus.z);
}

/* ═══════════ ENTER / EXIT ═══════════ */
function toggleCar() {
  if (!driving) {
    if (player.position.distanceTo(car.position) > RANGE) return;

    driving = true;
    player.visible = false;
  } else {
    driving = false;
    player.visible = true;

    const rx = Math.cos(car.rotation.y);
    const rz = -Math.sin(car.rotation.y);

    player.position.set(
      car.position.x + rx * 2.4,
      0,
      car.position.z + rz * 2.4
    );

    pushOut(player.position, RAD);
    clampW(player.position, RAD + .1);
  }

  document.getElementById('mode').textContent = driving ? 'DRIVING' : 'ON FOOT';
}

/* ═══════════ HUD / MOBILE BUTTON ═══════════ */
const mode = document.getElementById('mode');

function updateMobileUI() {
  if (!touchDevice) return;

  const near = !driving && player.position.distanceTo(car.position) <= RANGE;

  action.classList.toggle('show', driving || near);
  action.textContent = driving ? 'EXIT' : 'ENTER';
  touchUI.style.display = 'block';
}

setInterval(updateMobileUI, 100);

/* ═══════════ LOOP ═══════════ */
const clock = new THREE.Clock();
let first = true;

function loop() {
  requestAnimationFrame(loop);

  const dt = Math.min(clock.getDelta(), .05);

  if (enter) {
    toggleCar();
    enter = false;
  }

  if (driving) updateCar(dt);
  else updatePlayer(dt);

  updateCamera(dt, first);
  updateMobileUI();

  renderer.render(scene, camera);
  first = false;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, touchDevice ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
});

updateMobileUI();
updateCamera(0, true);
loop();
</script>
</body>
</html>
