<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nymaa — Top-Down City</title>
  </head>
  <body>
    <main id="game" aria-label="Nymaa game"></main>

    <section id="hud" aria-live="polite">
      <div class="hud-title">NYMAA / CITY BLOCKOUT</div>
      <div class="hud-row"><span>MODE</span><strong id="state">ON FOOT</strong></div>
      <div class="hud-row desktop-help"><span>MOVE</span><strong>WASD / ARROWS</strong></div>
      <div class="hud-row desktop-help"><span>ACTION</span><strong>E</strong></div>
    </section>

    <div id="prompt" class="prompt" hidden></div>

    <section id="touch-ui" aria-label="Touch controls">
      <div id="joystick" class="joystick" aria-label="Movement joystick">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>

      <button id="action" class="touch-button touch-action" type="button" hidden>
        <span id="action-label">E</span>
      </button>

      <div class="touch-hint">DRAG TO MOVE / DRIVE</div>
    </section>
  </body>
</html>
