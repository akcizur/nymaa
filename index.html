<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <title>POST-CATASTROPHE - WINDOWS 98 SKIN</title>
</head>
<body>
  <div id="load">LOADING WORLD…</div>

  <aside id="hud" class="hud">
    <div class="hud__brand">POST-CATASTROPHE <span>MVP</span></div>
    <div class="hud__time">
      <span id="clock">08:00</span>
      <span id="phase">DAY</span>
    </div>
    <div class="bars">
      <div class="bar"><span>HEALTH</span><i><b id="health"></b></i></div>
      <div class="bar"><span>HUNGER</span><i><b id="hunger"></b></i></div>
      <div class="bar"><span>THIRST</span><i><b id="thirst"></b></i></div>
    </div>
    <div id="objective" class="objective">Zkontroluj zásoby a vydej se na expedici.</div>
  </aside>

  <section id="hint" class="panel panel--hint hidden"></section>

  <section id="inventory" class="panel panel--inventory hidden">
    <header><strong>BACKPACK</strong><button data-close="inventory">×</button></header>
    <div id="inventory-list"></div>
    <div class="panel__foot" id="inventory-capacity"></div>
  </section>

  <section id="craft" class="panel panel--craft hidden">
    <header><strong>CRAFT / BUILD</strong><button data-close="craft">×</button></header>
    <div id="recipe-list"></div>
  </section>

  <section id="base" class="panel panel--base hidden">
    <header><strong>BASE</strong><button data-close="base">×</button></header>
    <div class="base-grid">
      <div>
        <small>STORAGE</small>
        <div id="storage-list"></div>
      </div>
      <div>
        <small>FUNCTIONAL SLOTS</small>
        <div id="build-list"></div>
      </div>
    </div>
    <div class="base-actions">
      <button id="store-all">STORE ALL</button>
      <button id="rest-button">REST / SLEEP</button>
      <button id="save-button">SAVE</button>
      <button id="load-button">LOAD</button>
    </div>
  </section>

  <section id="message" class="message"></section>

  <div id="touch" class="touch hidden">
    <div id="stick"><span></span></div>
    <button id="touch-interact">E</button>
    <button id="touch-inventory">I</button>
  </div>

  <div id="controls" class="controls">
    <span><kbd>WASD</kbd> MOVE</span>
    <span><kbd>SHIFT</kbd> RUN</span>
    <span><kbd>SPACE</kbd> JUMP ANIM</span>
    <span><kbd>F</kbd> PUNCH</span>
    <span><kbd>T</kbd> WORK</span>
    <span><kbd>E</kbd> INTERACT</span>
    <span><kbd>I</kbd> INVENTORY</span>
    <span><kbd>C</kbd> CRAFT / BUILD</span>
    <span><kbd>R</kbd> RESET</span>
    <span><kbd>L</kbd> LOAD</span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
